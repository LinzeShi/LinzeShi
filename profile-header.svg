<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Linze Shi — AI Inference and Infrastructure</title>
  <desc id="desc">A dark violet technical banner inspired by the stages of an LLM inference request.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.55" stop-color="#10172a"/>
      <stop offset="1" stop-color="#19102c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#c06dd7"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="28" fill="url(#grid)"/>
  <circle cx="1050" cy="72" r="220" fill="url(#glow)"/>
  <path d="M0 276C260 232 410 314 650 260C860 214 1010 245 1200 184" fill="none" stroke="url(#accent)" stroke-opacity="0.14" stroke-width="2"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="64" y="104" fill="#f8fafc" font-size="52" font-weight="700" letter-spacing="-1.5">Linze Shi</text>
    <rect x="64" y="126" width="116" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="163" fill="#cbd5e1" font-size="20" font-weight="500">AI INFERENCE · INFRASTRUCTURE · RESEARCH</text>
    <text x="64" y="196" fill="#94a3b8" font-size="16">From model behavior to the systems that serve it.</text>

    <g transform="translate(64 226)" font-size="13" font-weight="600" letter-spacing="0.6">
      <rect width="132" height="32" rx="16" fill="#8b5cf6" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="66" y="21" text-anchor="middle" fill="#ddd6fe">LLM INFERENCE</text>
      <rect x="144" width="148" height="32" rx="16" fill="#c06dd7" fill-opacity="0.13" stroke="#d8b4fe" stroke-opacity="0.5"/>
      <text x="218" y="21" text-anchor="middle" fill="#f3e8ff">AI INFRASTRUCTURE</text>
      <rect x="304" width="112" height="32" rx="16" fill="#38bdf8" fill-opacity="0.11" stroke="#7dd3fc" stroke-opacity="0.5"/>
      <text x="360" y="21" text-anchor="middle" fill="#bae6fd">ML SYSTEMS</text>
    </g>
  </g>

  <g transform="translate(760 42)">
    <rect width="380" height="184" rx="18" fill="#020617" fill-opacity="0.48" stroke="#94a3b8" stroke-opacity="0.16"/>
    <g stroke="#64748b" stroke-opacity="0.18">
      <path d="M24 36H356M24 74H356M24 112H356M24 150H356"/>
      <path d="M74 20V164M144 20V164M214 20V164M284 20V164"/>
    </g>
    <path d="M26 136C57 136 66 122 94 122S135 134 160 109S203 94 229 94S268 70 292 67S327 57 354 54" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)"/>
    <g fill="#e2e8f0" stroke="#8b5cf6" stroke-width="3">
      <circle cx="94" cy="122" r="5"/><circle cx="160" cy="109" r="5"/><circle cx="229" cy="94" r="5"/><circle cx="292" cy="67" r="5"/><circle cx="354" cy="54" r="5"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#94a3b8">
      <text x="24" y="26">request</text>
      <text x="299" y="178">tokens →</text>
      <text x="68" y="154" fill="#c4b5fd">prefill</text>
      <text x="286" y="48" fill="#bae6fd">decode</text>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#cbd5e1">
      <rect x="22" y="80" width="58" height="22" rx="11" fill="#8b5cf6" fill-opacity="0.13"/>
      <text x="51" y="95" text-anchor="middle">schedule</text>
      <rect x="91" y="80" width="48" height="22" rx="11" fill="#c06dd7" fill-opacity="0.13"/>
      <text x="115" y="95" text-anchor="middle">batch</text>
      <rect x="150" y="80" width="55" height="22" rx="11" fill="#38bdf8" fill-opacity="0.11"/>
      <text x="177" y="95" text-anchor="middle">execute</text>
    </g>
  </g>

  <circle cx="1160" cy="260" r="4" fill="#38bdf8"/>
  <circle cx="1138" cy="260" r="4" fill="#c06dd7"/>
  <circle cx="1116" cy="260" r="4" fill="#8b5cf6"/>
</svg>
